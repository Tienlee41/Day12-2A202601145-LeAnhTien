name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test checkpoints
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AGENT_API_KEY: ci-dummy-key
      REDIS_URL: fake://

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run local checkpoint tests
        run: >-
          python -m pytest tests
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py
          -m "not docker"

  build:
    name: Build production image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag day12-agent:${{ github.sha }} .

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      PUBLIC_URL: https://day12-agent-l002.onrender.com
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Trigger Render deploy hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        run: curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Note Render auto-deploy fallback
        if: env.RENDER_DEPLOY_HOOK_URL == ''
        run: echo "Deploy hook is not configured; Render's Git integration handles this push."

      - name: Smoke test deployed service
        shell: bash
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --show-error "$PUBLIC_URL/health" \
              && curl --fail --silent --show-error "$PUBLIC_URL/ready"; then
              echo "Render service is healthy and ready."
              exit 0
            fi
            echo "Attempt $attempt/20 failed; retrying in 15 seconds..."
            sleep 15
          done
          echo "Render service did not become ready in time."
          exit 1
